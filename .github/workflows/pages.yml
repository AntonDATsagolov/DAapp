name: Deploy DAapp preview to GitHub Pages

on:
  push:
    branches:
      - main
      - setup/initial-pwa-scaffold
  workflow_dispatch:

# Only the workflow gets deployment privileges, not the browser application.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daapp-github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out DAapp
        uses: actions/checkout@v4

      - name: Prepare public website only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R client-app business-app driver-app admin-app account-app directory-app shared diagnostics _site/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="ru">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="refresh" content="0;url=./client-app/">
            <title>DAapp</title>
          </head>
          <body>
            <p><a href="./client-app/">Открыть DAapp для жителей</a></p>
          </body>
          </html>
          HTML
          touch _site/.nojekyll
          test -f _site/client-app/index.html
          test -f _site/client-app/map.js
          test -f _site/client-app/places.js
          test -f _site/client-app/styles.css
          test -f _site/business-app/index.html
          test -f _site/admin-app/index.html
          test -f _site/admin-app/checks.js
          test -f _site/business-app/submissions.js
          test -f _site/driver-app/index.html
          test -f _site/driver-app/driver.js
          test -f _site/account-app/index.html
          test -f _site/account-app/auth.js
          test -f _site/account-app/email-registration.js
          test -f _site/directory-app/index.html
          test -f _site/admin-app/accounts.js
          test -f _site/shared/supabase.js
          test -f _site/diagnostics/index.html
          if grep -REq 'sb_secret_[A-Za-z0-9_-]{10,}' _site; then
            echo "Refusing to deploy: Supabase secret key found."
            exit 1
          fi

      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check published HTTPS pages
        shell: bash
        run: |
          set -euo pipefail
          base="https://antondatsagolov.github.io/DAapp"
          for path in client-app/ client-app/map.js client-app/places.js client-app/styles.css business-app/ business-app/submissions.js admin-app/ admin-app/checks.js admin-app/accounts.js driver-app/ driver-app/driver.js account-app/ account-app/auth.js account-app/email-registration.js directory-app/ shared/supabase.js diagnostics/; do
            echo "Checking $base/$path"
            success=0
            for attempt in $(seq 1 15); do
              if curl --fail --silent --show-error --location --max-time 15 "$base/$path" -o /tmp/daapp-page; then
                success=1
                break
              fi
              sleep 4
            done
            if [[ "$success" != 1 ]]; then
              echo "FAIL: published path was not reachable: $path"
              exit 1
            fi
            echo "PASS: $path"
          done
      - name: Verify deployed registration and admin-only sign-in UI
        shell: bash
        run: |
          set -euo pipefail
          base="https://antondatsagolov.github.io/DAapp"
          for app in client-app business-app driver-app admin-app; do
            expected="shouldCreateUser: false"
            verified=0
            for attempt in $(seq 1 15); do
              if curl --fail --silent --show-error --location --max-time 15 \
                "$base/$app/" -o /tmp/daapp-registration.html &&
                  grep -Fq "signInWithOtp" /tmp/daapp-registration.html &&
                  grep -Fq "$expected" /tmp/daapp-registration.html; then
                verified=1
                break
              fi
              sleep 4
            done
            if [[ "$verified" != 1 ]]; then
              echo "FAIL: registration/login code missing or stale for $app"
              exit 1
            fi
            echo "PASS: $app uses legacy OTP without creating duplicate accounts"
          done

      - name: Verify live unified account signup page
        shell: bash
        run: |
          set -euo pipefail
          base="https://antondatsagolov.github.io/DAapp"
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error --location --max-time 15 "$base/account-app/" -o /tmp/daapp-new-auth.html &&
                grep -Fq "signupForm" /tmp/daapp-new-auth.html &&
                grep -Fq "signupEmail" /tmp/daapp-new-auth.html &&
                grep -Fq "signupAvatar" /tmp/daapp-new-auth.html &&
                grep -Fq "decisionStatus" /tmp/daapp-new-auth.html; then
              echo "PASS: public unified identity page is available"
              exit 0
            fi
            sleep 4
          done
          echo "Unified account registration page not published correctly"
          exit 1

      - name: Report Supabase Auth availability (no credentials)
        shell: bash
        run: |
          curl --location --silent --show-error --max-time 15 --output /dev/null --write-out 'Supabase Auth health HTTP %{http_code}\n' https://huajxbmapmlprcyytsvu.supabase.co/auth/v1/health || true
